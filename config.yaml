# CMIP6 GPT Pipeline Configuration
# All pipeline parameters in one place for reproducibility and benchmarking.

rag:
  # Minimum cosine similarity to accept a RAG candidate (higher = stricter)
  # Qdrant cosine similarity: good matches ~0.5–0.9, noise <0.3
  # Tuned from 150-query benchmark with gemini-embedding-2-preview
  score_threshold: 0.5

  # Maximum number of candidates per facet in dynamic schema
  # Reduced from 10: with 95% Hit@5, fewer candidates = less LLM confusion
  max_candidates: 5

  # Minimum candidates to keep even if all scores exceed threshold
  min_candidates: 3

  # Number of top matches to retrieve from each Qdrant collection
  top_k: 50

  # Qdrant vector database (unified backend for all retrieval)
  qdrant:
    url: "http://localhost:6333"
    collections:
      variable_id: "cmip6_variables"
      source_id: "cmip6_sources"
      experiment_id: "cmip6_experiments"
      literature: "cmip6_papers"

  # Re-ranking configuration
  reranking:
    enabled: true
    # Boost candidates whose metadata source name appears in the query
    query_match_boost: 0.3

llm:
  # Default model for the agent
  default_model: "gemini-3.1-pro-preview"
  # Available models for UI selection (OpenAI + Google)
  available_models:
    - "gemini-3.1-pro-preview"
    - "gpt-5.4"
    - "gpt-5.2"
  # Temperature for deterministic tool calls (facet selection, value selection)
  tool_temperature: 0
  # Embedding model (gemini-embedding-2-preview — 768-dim, MRL, multimodal)
  embedding_model: "gemini-embedding-2-preview"
  # Embedding provider: "google" or "openai"
  embedding_provider: "google"

agent:
  # Maximum iterations for the agent executor
  max_iterations: 30

esgf:
  # ESGF search node URL
  search_url: "https://esgf-node.llnl.gov/esg-search/search"
  # ESGF web frontend base URL
  web_frontend_url: "https://aims2.llnl.gov/search?"
