# CMIP6 GPT Pipeline Configuration
# All pipeline parameters in one place for reproducibility and benchmarking.

rag:
  # Maximum L2 distance to accept a RAG candidate (lower = stricter)
  # Gemini embeddings (3072-dim): correct matches ~0.2–0.6, noise >1.0
  # Tuned from 150-query benchmark with gemini-embedding-001
  score_threshold: 0.8

  # Maximum number of candidates per facet in dynamic schema
  # Reduced from 10: with 95% Hit@5, fewer candidates = less LLM confusion
  max_candidates: 5

  # Minimum candidates to keep even if all scores exceed threshold
  min_candidates: 3

  # Number of top matches to retrieve from each ChromaDB collection
  top_k: 20

  # ChromaDB collection paths (relative to project root)
  # Gemini-embedding-001 collections (150-query benchmark):
  #   Overall MRR=0.78, Hit@5=95%
  #   v2_gemini_variables:   MRR=0.72, H@5=90%
  #   v2_gemini_experiments: MRR=0.77, H@5=98%
  #   v3_gemini_sources:     MRR=0.82, H@5=96%
  retrievers:
    variable_id: "retrievers/v2_gemini_variables"
    source_id: "retrievers/v3_gemini_sources"
    experiment_id: "retrievers/v2_gemini_experiments"

  # Re-ranking configuration
  reranking:
    enabled: true
    # Boost candidates whose metadata source name appears in the query
    query_match_boost: 0.3

llm:
  # Default model for the agent
  default_model: "gpt-5.2"
  # Available models for UI selection (OpenAI + Google)
  available_models:
    - "gpt-5.2"
    - "gemini-3.1-pro-preview"
  # Temperature for deterministic tool calls (facet selection, value selection)
  tool_temperature: 0
  # Embedding model (Gemini — 20x cheaper than OpenAI 3-large, better accuracy)
  embedding_model: "models/gemini-embedding-001"
  # Embedding provider: "google" or "openai"
  embedding_provider: "google"

agent:
  # Maximum iterations for the agent executor
  max_iterations: 30

esgf:
  # ESGF search node URL
  search_url: "https://esgf-node.llnl.gov/esg-search/search"
  # ESGF web frontend base URL
  web_frontend_url: "https://aims2.llnl.gov/search?"
